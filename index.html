<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Aisha 🎂✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Parisienne&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN TOKENS
     ============================================================ */
  :root{
    --c-void:#06040c;
    --c-gold:#eec084;
    --c-gold-bright:#ffe0ac;
    --c-rose:#eda8c9;
    --c-lilac:#b79aeb;
    --c-cream:#fbf4e8;
    --c-ink:#3a2647;
    --c-ink-soft:#6f5a7d;
    --ease-cinematic:cubic-bezier(.22,.61,.36,1);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:var(--c-void);
    font-family:'Jost',sans-serif;
  }

  body{ position:relative; }

  button{ font-family:inherit; }

  /* ============================================================
     BACKGROUND LAYERS
     ============================================================ */
  .bg-lit{
    position:fixed; inset:0; z-index:0; opacity:0;
    transition:opacity 2.4s ease;
    background:
      radial-gradient(ellipse 60% 45% at 28% 18%, rgba(237,168,201,.35), transparent 60%),
      radial-gradient(ellipse 55% 45% at 78% 14%, rgba(183,154,235,.32), transparent 58%),
      radial-gradient(ellipse 70% 50% at 50% 105%, rgba(238,192,132,.28), transparent 62%),
      linear-gradient(180deg,#170c28 0%,#231436 45%,#2c1640 100%);
  }
  body.lit .bg-lit{ opacity:1; }

  .glow-blob{
    position:fixed; border-radius:50%; filter:blur(70px);
    opacity:0; transition:opacity 2.6s ease .2s; z-index:0;
  }
  body.lit .glow-blob{ opacity:.5; }
  .blob-rose{ width:40vw; height:40vw; left:-10vw; top:-8vw; background:var(--c-rose); animation:floatSlow 15s ease-in-out infinite; }
  .blob-lilac{ width:36vw; height:36vw; right:-12vw; top:8vh; background:var(--c-lilac); animation:floatSlow 18s ease-in-out infinite reverse; }
  .blob-gold{ width:32vw; height:32vw; left:18vw; bottom:-16vh; background:var(--c-gold); animation:floatSlow 21s ease-in-out infinite; }
  @keyframes floatSlow{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(3vw,-2.4vh);} }

  .vignette{
    position:fixed; inset:0; z-index:8; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 52%, rgba(0,0,0,.5) 100%);
  }

  /* ============================================================
     FAIRY LIGHTS
     ============================================================ */
  .fairylights-container{
    position:fixed; top:0; left:0; width:100%; height:15vh; max-height:120px;
    z-index:3; pointer-events:none;
  }
  .wire-svg{ position:absolute; inset:0; width:100%; height:100%; }
  .wire-path{ fill:none; stroke:rgba(255,255,255,.10); stroke-width:.3; stroke-linecap:round; stroke-linejoin:round; }
  .bulb-layer{ position:absolute; inset:0; }
  .bulb{
    position:absolute; width:7px; height:7px; border-radius:50%;
    background:var(--c-gold); transform:translate(-50%,-50%);
    opacity:.12; transition:opacity .7s ease, box-shadow .7s ease;
  }
  .bulb.on{
    opacity:1;
    box-shadow:0 0 8px 2px rgba(238,192,132,.85), 0 0 22px 7px rgba(238,192,132,.35);
    animation:bulbTwinkle 3.6s ease-in-out infinite;
  }
  @keyframes bulbTwinkle{ 0%,100%{filter:brightness(1);} 50%{filter:brightness(1.4);} }

  /* ============================================================
     PARTICLES / SPARKLES
     ============================================================ */
  .particles{ position:fixed; inset:0; z-index:3; pointer-events:none; overflow:hidden; }
  .spark{
    position:absolute; border-radius:50%; background:#fff;
    animation:twinkle var(--dur,4s) ease-in-out infinite;
    animation-delay:var(--del,0s);
  }
  @keyframes twinkle{
    0%,100%{ opacity:var(--minop,.1); transform:scale(.8); }
    50%{ opacity:var(--maxop,.7); transform:scale(1.25); }
  }

  /* ============================================================
     LIGHT FLOOD BURST
     ============================================================ */
  .light-flood{
    position:fixed; inset:0; z-index:9; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 50% 42%, rgba(255,224,172,.95), rgba(255,224,172,0) 60%);
  }
  .light-flood.burst{ animation:floodBurst 1.4s var(--ease-cinematic) forwards; }
  @keyframes floodBurst{
    0%{ opacity:0; transform:scale(.15); }
    35%{ opacity:.85; transform:scale(1); }
    100%{ opacity:0; transform:scale(1.7); }
  }

  /* ============================================================
     CONFETTI + HEARTS
     ============================================================ */
  .confetti-layer,.hearts-layer{ position:fixed; inset:0; z-index:6; pointer-events:none; overflow:hidden; }
  .confetti-piece{
    position:absolute; top:-24px; border-radius:2px; opacity:.95;
    animation:confettiFall linear forwards;
  }
  @keyframes confettiFall{ to{ transform:translateY(130vh) rotate(var(--rot,360deg)); opacity:0; } }

  .heart-piece{ position:absolute; bottom:-20px; width:13px; height:13px; transform:rotate(-45deg); opacity:0; filter:drop-shadow(0 0 5px rgba(238,192,132,.4)); animation:heartFloat linear forwards; }
  .heart-piece::before,.heart-piece::after{ content:""; position:absolute; width:13px; height:13px; border-radius:50%; background:inherit; }
  .heart-piece::before{ top:-6.5px; left:0; }
  .heart-piece::after{ left:6.5px; top:0; }
  @keyframes heartFloat{
    0%{ transform:translateY(0) rotate(-45deg); opacity:0; }
    12%{ opacity:.8; }
    100%{ transform:translateY(-75vh) rotate(-45deg); opacity:0; }
  }

  /* ============================================================
     CAKE
     ============================================================ */
  .cake-wrap{
    position:fixed; left:50%; top:56%; z-index:4;
    transform:translate(-50%,-45%) scale(.55);
    opacity:0; pointer-events:none;
    transition:top 1.15s var(--ease-cinematic), transform 1.15s var(--ease-cinematic), opacity 1s ease;
  }
  .cake-wrap.state-center{ opacity:1; top:57%; transform:translate(-50%,-50%) scale(1); }
  .cake-wrap.state-final{ opacity:1; top:15vh; transform:translate(-50%,0) scale(.6); }

  .cake{ position:relative; width:clamp(160px,26vw,230px); display:flex; flex-direction:column; align-items:center; }
  .tier{ position:relative; box-shadow:0 12px 26px rgba(0,0,0,.4); }
  .tier::before{
    content:""; position:absolute; top:-9px; left:0; right:0; height:18px;
    background:radial-gradient(circle at 9px 9px, var(--tier-color) 8px, transparent 9px);
    background-size:18px 18px; background-repeat:repeat-x;
  }
  .tier-top{
    width:64%; height:clamp(44px,7vw,56px); border-radius:10px 10px 4px 4px;
    background:linear-gradient(180deg,#fbeaf3,#f3cfe4); --tier-color:#fbeaf3; z-index:2;
  }
  .tier-bottom{
    width:100%; height:clamp(58px,9vw,74px); margin-top:-2px; border-radius:12px 12px 5px 5px;
    background:linear-gradient(180deg,#f8ecd6,#eed6ab); --tier-color:#f8ecd6; z-index:1;
  }
  .tier-bottom::after{
    content:""; position:absolute; left:6%; right:6%; bottom:22%; height:6px;
    background:rgba(255,255,255,.4); border-radius:3px;
  }
  .candle-row{ position:absolute; top:-32px; left:50%; transform:translateX(-50%); display:flex; gap:12px; z-index:3; }
  .candle{ width:4px; height:30px; border-radius:2px; background:linear-gradient(180deg,#fff,var(--c-gold)); position:relative; }
  .candle::after{
    content:""; position:absolute; top:-13px; left:50%; width:8px; height:13px;
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    background:radial-gradient(circle at 50% 32%, #fff6d0, var(--c-gold-bright) 42%, #ff9d4d 82%);
    filter:drop-shadow(0 0 6px rgba(255,180,90,.85));
    animation:flicker 1.6s ease-in-out infinite; animation-delay:var(--fd,0s);
    transform-origin:center bottom; transform:translateX(-50%);
  }
  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) scale(1) rotate(0deg); }
    25%{ transform:translateX(-50%) scale(1.06,.94) rotate(-3deg); }
    50%{ transform:translateX(-50%) scale(.94,1.05) rotate(2deg); }
    75%{ transform:translateX(-50%) scale(1.02,.98) rotate(-1deg); }
  }
  .cake-plate{
    position:absolute; left:50%; bottom:-8px; transform:translateX(-50%);
    width:96%; height:14px; border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.4), transparent 72%);
    filter:blur(2px);
  }

  /* ============================================================
     DIALOGS
     ============================================================ */
  .dialog-layer{ position:fixed; inset:0; z-index:50; pointer-events:none; }
  .dialog-card{
    position:absolute; left:50%; top:50%;
    width:min(90vw,440px);
    transform:translate(-50%,-50%) translateY(20px) scale(.96);
    background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
    border:1px solid rgba(255,255,255,.16);
    border-radius:26px;
    padding:clamp(28px,6vw,42px) clamp(22px,6vw,36px);
    text-align:center;
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 40px rgba(238,192,132,.15);
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity .7s var(--ease-cinematic), transform .7s var(--ease-cinematic), visibility 0s linear .7s;
  }
  .dialog-card.show{
    opacity:1; visibility:visible; pointer-events:auto;
    transform:translate(-50%,-50%) translateY(0) scale(1);
    transition:opacity .7s var(--ease-cinematic), transform .7s var(--ease-cinematic), visibility 0s linear 0s;
  }
  .dialog-title{
    margin:0; font-family:'Playfair Display',serif; font-weight:600; font-style:italic;
    font-size:clamp(1.15rem,4.6vw,1.55rem); line-height:1.55; color:#f7eefb;
    text-shadow:0 2px 18px rgba(0,0,0,.4);
  }

  .btn-glow{
    margin-top:clamp(20px,5vw,30px); border:none; cursor:pointer;
    font-family:'Jost',sans-serif; font-weight:500; letter-spacing:.02em;
    font-size:clamp(.92rem,2.8vw,1.02rem); color:#2a1533;
    background:linear-gradient(135deg,var(--c-gold-bright),var(--c-rose));
    padding:15px 28px; border-radius:999px;
    box-shadow:0 8px 24px rgba(238,192,132,.35);
    animation:btnPulse 2.6s ease-in-out infinite;
    transition:transform .35s var(--ease-cinematic), box-shadow .35s;
  }
  @keyframes btnPulse{
    0%,100%{ box-shadow:0 8px 24px rgba(238,192,132,.35), 0 0 0 rgba(255,224,172,.5); }
    50%{ box-shadow:0 8px 30px rgba(238,192,132,.5), 0 0 26px rgba(255,224,172,.55); }
  }
  .btn-glow:hover{ transform:translateY(-2px) scale(1.02); }
  .btn-glow:active{ transform:translateY(0) scale(.97); }
  .btn-glow:focus-visible{ outline:2px solid #fff; outline-offset:4px; }

  /* ============================================================
     FINAL SCENE
     ============================================================ */
  .final-scene{
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(10px,2.2vh,18px);
    padding:14vh 5vw 3vh;
    opacity:0; pointer-events:none;
    transition:opacity 1.1s ease;
  }
  .final-scene.active{ opacity:1; pointer-events:auto; }

  .headline{
    font-family:'Playfair Display',serif; font-weight:700; font-style:italic;
    text-align:center; margin:0; line-height:1.22;
    font-size:clamp(1.5rem,6vw,2.7rem);
    color:var(--c-gold-bright);
    text-shadow:0 0 18px rgba(255,224,172,.55), 0 0 46px rgba(237,168,201,.32);
  }
  .headline .word{
    display:inline-block; opacity:0; filter:blur(6px);
    transform:translateY(14px) scale(.9);
    animation:wordIn .9s var(--ease-cinematic) forwards;
  }
  @keyframes wordIn{ to{ opacity:1; filter:blur(0); transform:translateY(0) scale(1); } }

  .letter-card{
    width:min(90vw,540px); max-height:34vh; overflow-y:auto;
    margin-top:2px;
    background:linear-gradient(180deg, rgba(251,244,232,.95), rgba(251,244,232,.9));
    border-radius:20px;
    padding:clamp(20px,4.4vw,32px) clamp(20px,4.4vw,30px);
    box-shadow:0 24px 55px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.5);
  }
  .letter-card::-webkit-scrollbar{ width:6px; }
  .letter-card::-webkit-scrollbar-thumb{ background:rgba(238,192,132,.55); border-radius:3px; }

  .letter-line{
    font-family:'Cormorant Garamond',serif; font-weight:500;
    font-size:clamp(.98rem,2.5vw,1.14rem); line-height:1.62; color:var(--c-ink);
    margin:0 0 12px; opacity:0; filter:blur(6px); transform:translateY(14px);
    transition:opacity .8s var(--ease-cinematic), transform .8s var(--ease-cinematic), filter .8s var(--ease-cinematic);
  }
  .letter-line:last-of-type{ margin-bottom:0; }
  .letter-line.show{ opacity:1; filter:blur(0); transform:translateY(0); }

  .signature{ margin-top:16px; text-align:right; opacity:0; transform:translateY(10px); transition:opacity .9s ease, transform .9s ease; }
  .signature.show{ opacity:1; transform:translateY(0); }
  .sig-pre{ display:block; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:.85rem; color:var(--c-ink-soft); margin-bottom:2px; }
  .sig-name{ display:block; font-family:'Parisienne',cursive; font-size:clamp(1.35rem,4.2vw,1.85rem); color:var(--c-ink); }

  .btn-ghost{
    margin-top:2px; background:transparent; border:1px solid rgba(255,255,255,.35);
    color:var(--c-gold-bright); font-size:.8rem; letter-spacing:.05em;
    padding:10px 22px; border-radius:999px; cursor:pointer;
    opacity:0; pointer-events:none;
    transition:opacity 1s ease, background .3s, transform .3s;
  }
  .btn-ghost.show{ opacity:.85; pointer-events:auto; }
  .btn-ghost:hover{ background:rgba(255,255,255,.08); transform:translateY(-1px); }
  .btn-ghost:focus-visible{ outline:2px solid #fff; outline-offset:3px; }

  /* ============================================================
     MUSIC CONTROL
     ============================================================ */
  .music-control{
    position:fixed; bottom:max(18px, env(safe-area-inset-bottom)); right:18px; z-index:40;
    width:50px; height:50px; border-radius:50%;
    border:1px solid rgba(255,255,255,.25); background:rgba(20,10,30,.55);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:flex; align-items:flex-end; justify-content:center; gap:3px; padding-bottom:15px;
    cursor:pointer; opacity:0; transform:scale(.8);
    transition:opacity .6s ease, transform .6s ease;
  }
  .music-control.show{ opacity:1; transform:scale(1); }
  .eq-bar{ width:3px; height:14px; background:var(--c-gold-bright); border-radius:2px; transform-origin:bottom; animation:eq .9s ease-in-out infinite; }
  .eq-bar:nth-child(1){ height:11px; }
  .eq-bar:nth-child(2){ height:18px; animation-delay:.15s; }
  .eq-bar:nth-child(3){ height:9px; animation-delay:.3s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(.4); } 50%{ transform:scaleY(1); } }
  .music-control.paused .eq-bar{ animation-play-state:paused; transform:scaleY(.3); }
  .music-control:focus-visible{ outline:2px solid #fff; outline-offset:3px; }

  /* ============================================================
     ACCESSIBILITY
     ============================================================ */
  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.2s !important; }
  }

  @media (max-width:420px){
    .letter-card{ max-height:30vh; }
    .final-scene{ padding-top:12vh; }
  }
</style>
</head>
<body>

  <div class="bg-lit" id="bgLit"></div>
  <div class="glow-blob blob-rose"></div>
  <div class="glow-blob blob-lilac"></div>
  <div class="glow-blob blob-gold"></div>

  <div class="fairylights-container">
    <svg class="wire-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path id="wirePath" class="wire-path" d=""></path>
    </svg>
    <div class="bulb-layer" id="bulbLayer"></div>
  </div>

  <div class="particles" id="particles"></div>
  <div class="confetti-layer" id="confettiLayer"></div>
  <div class="hearts-layer" id="heartsLayer"></div>
  <div class="vignette"></div>
  <div class="light-flood" id="lightFlood"></div>

  <div class="cake-wrap state-hidden" id="cakeWrap">
    <div class="cake">
      <div class="tier tier-top">
        <div class="candle-row" id="candleRow"></div>
      </div>
      <div class="tier tier-bottom"></div>
      <div class="cake-plate"></div>
    </div>
  </div>

  <div class="final-scene" id="finalScene">
    <h1 class="headline" id="headline"></h1>
    <div class="letter-card" id="letterCard">
      <div id="letterLines"></div>
      <div class="signature" id="signature">
        <span class="sig-pre"></span>
        <span class="sig-name"></span>
      </div>
    </div>
    <button class="btn-ghost" id="celebrateBtn">Celebrate Again ✨</button>
  </div>

  <div class="dialog-layer" id="dialogLayer">
    <div class="dialog-card" id="dialog1">
      <p class="dialog-title">Hey Birthday Girl… ✨<br>Before we begin, would you like to turn on the lights?</p>
      <button class="btn-glow" id="dialog1Btn">Yes, turn on the lights ✨</button>
    </div>
    <div class="dialog-card" id="dialog2">
      <p class="dialog-title">The lights look beautiful… but something is still missing. 🎶<br>Should we turn on the music?</p>
      <button class="btn-glow" id="dialog2Btn">Yes, play the music 🎵</button>
    </div>
    <div class="dialog-card" id="dialog3">
      <p class="dialog-title">Everything is ready now… but wait! 🎂<br>Where is the birthday cake? Should we bring it in?</p>
      <button class="btn-glow" id="dialog3Btn">Yes, bring the cake! 🎂</button>
    </div>
  </div>

  <button class="music-control" id="musicControl" hidden aria-label="Play or pause music">
    <span class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span>
  </button>

  <audio id="bgMusic" loop preload="none"></audio>

<script>
/* ================================================================
   🎂 CONFIGURATION — edit everything about this celebration here
   ================================================================ */
const CONFIG = {
  // Her name — shown in the big final headline
  herName: "Aisha",

  // Your name — shown in the closing signature
  yourName: "Aryan",

  // The letter, one paragraph per line, revealed in this order
  letterParagraphs: [
    "Happy Birthday to the most special person in my life. ❤️",
    "I hope your day is filled with happiness, laughter, beautiful surprises, and everything that makes you smile. You make even the simplest moments feel special, and I'm truly grateful to have you in my life.",
    "Thank you for all the smiles, memories, and happiness you bring. I hope this new year of your life gives you countless reasons to smile and brings you everything you truly deserve.",
    "Keep being the wonderful, caring, and adorable person you are. And always remember that you are incredibly special to me. ❤️",
    "Happy Birthday once again, my better half. ✨"
  ],

  // The line just above your name at the bottom of the letter
  signaturePrefix: "With lots of love,",

  // ---- MUSIC ----
  // Default = the song you uploaded, embedded so the page works
  // instantly with no extra files to host.
  // To use a different song instead, either:
  //   1) Paste a hosted URL, e.g. "https://yoursite.com/song.mp3", or

  els.dialog1 = document.getElementById('dialog1');
  els.dialog2 = document.getElementById('dialog2');
  els.dialog3 = document.getElementById('dialog3');

  els.bgMusic.src = CONFIG.musicSrc;

  buildLetter();
  buildCandles();
  buildFairyLights();
  buildAmbientParticles();

  document.getElementById('dialog1Btn').addEventListener('click', onDialog1);
  document.getElementById('dialog2Btn').addEventListener('click', onDialog2);
  document.getElementById('dialog3Btn').addEventListener('click', onDialog3);
  els.celebrateBtn.addEventListener('click', resetExperience);
  els.musicControl.addEventListener('click', toggleMusic);
  window.addEventListener('resize', debounce(buildFairyLights, 300));

  setTimeout(()=> els.dialog1.classList.add('show'), 500);
}

const state = { heartTimer:null, fadeTimer:null };

/* ================================================================
   STEP 1 — LIGHTS
   ================================================================ */
function onDialog1(){
  els.dialog1.classList.remove('show');
  setTimeout(()=>{
    turnOnLights();
    setTimeout(()=> els.dialog2.classList.add('show'), 1900);
  }, 450);
}

function turnOnLights(){
  document.body.classList.add('lit');
  els.lightFlood.classList.remove('burst');
  void els.lightFlood.offsetWidth;
  els.lightFlood.classList.add('burst');
  document.querySelectorAll('.bulb').forEach(b=> b.classList.add('on'));
  boostParticles();
}

/* ================================================================
   STEP 2 — MUSIC
   ================================================================ */
function onDialog2(){
  els.dialog2.classList.remove('show');
  setTimeout(()=>{
    playMusic();
    setTimeout(()=> els.dialog3.classList.add('show'), 1000);
  }, 450);
}

function playMusic(){
  const audio = els.bgMusic;
  audio.volume = 0;
  const p = audio.play();
  if(p && p.catch) p.catch(()=>{ /* will resume on next user interaction if blocked */ });
  fadeAudioTo(CONFIG.musicVolume, 1800);
  els.musicControl.hidden = false;
  els.musicControl.classList.remove('paused');
  requestAnimationFrame(()=> els.musicControl.classList.add('show'));
}

function fadeAudioTo(target, duration){
  const audio = els.bgMusic;
  clearInterval(state.fadeTimer);
  const steps = 30, stepTime = duration/steps, start = audio.volume;
  let i = 0;
  state.fadeTimer = setInterval(()=>{
    i++;
    audio.volume = Math.min(Math.max(start + (target-start)*(i/steps), 0), 1);
    if(i >= steps){ clearInterval(state.fadeTimer); audio.volume = target; }
  }, stepTime);
}

function toggleMusic(){
  const audio = els.bgMusic;
  if(audio.paused){ audio.play(); els.musicControl.classList.remove('paused'); }
  else { audio.pause(); els.musicControl.classList.add('paused'); }
}

/* ================================================================
   STEP 3 — CAKE
   ================================================================ */
function onDialog3(){
  els.dialog3.classList.remove('show');
  setTimeout(()=>{
    bringCake();
    setTimeout(startFinalReveal, 1300 + 2000);
  }, 450);
}

function bringCake(){
  els.cakeWrap.classList.remove('state-hidden');
  els.cakeWrap.classList.add('state-center');
  setTimeout(()=> sparkleBurstAt(50,57), 500);
}

/* ================================================================
   STEP 4 — FINAL REVEAL
   ================================================================ */
function startFinalReveal(){
  els.cakeWrap.classList.remove('state-center');
  els.cakeWrap.classList.add('state-final');
  els.finalScene.classList.add('active');
  buildHeadline();
  burstConfetti(50);
  setTimeout(()=> burstConfetti(26), 550);
  setTimeout(revealLetter, 1200);
  clearInterval(state.heartTimer);
  state.heartTimer = setInterval(spawnHeart, 1600);
}

function buildHeadline(){
  const text = `HAPPY BIRTHDAY, ${CONFIG.herName}! 🎂❤️`;
  const words = text.split(' ');
  els.headline.innerHTML = '';
  words.forEach((w,i)=>{
    const span = document.createElement('span');
    span.className = 'word';
    span.textContent = w;
    span.style.animationDelay = (i*140)+'ms';
    els.headline.appendChild(span);
    if(i < words.length-1) els.headline.appendChild(document.createTextNode(' '));
  });
}

function buildLetter(){
  els.letterLines.innerHTML = '';
  CONFIG.letterParagraphs.forEach(p=>{
    const el = document.createElement('p');
    el.className = 'letter-line';
    el.textContent = p;
    els.letterLines.appendChild(el);
  });
  els.signature.querySelector('.sig-pre').textContent = CONFIG.signaturePrefix;
  els.signature.querySelector('.sig-name').textContent = CONFIG.yourName + ' ❤️';
}

function revealLetter(){
  const lines = els.letterLines.querySelectorAll('.letter-line');
  lines.forEach((el,i)=> setTimeout(()=> el.classList.add('show'), i*560));
  const sigDelay = lines.length*560 + 300;
  setTimeout(()=> els.signature.classList.add('show'), sigDelay);
  setTimeout(()=> els.celebrateBtn.classList.add('show'), sigDelay + 700);
}

/* ================================================================
   CAKE BUILD
   ================================================================ */
function buildCandles(){
  els.candleRow.innerHTML = '';
  const n = CONFIG.candleCount || 4;
  for(let i=0;i<n;i++){
    const c = document.createElement('div');
    c.className = 'candle';
    c.style.setProperty('--fd', (Math.random()*1.2).toFixed(2)+'s');
    els.candleRow.appendChild(c);
  }
}

/* ================================================================
   FAIRY LIGHTS BUILD
   ================================================================ */
function buildFairyLights(){
  els.bulbLayer.innerHTML = '';
  const lit = document.body.classList.contains('lit');
  const count = window.innerWidth < 640 ? 11 : 19;
  const pts = [];
  for(let i=0;i<count;i++){
    const t = count===1 ? 0 : i/(count-1);
    const x = t*100;
    const y = 34 + Math.sin(t*Math.PI*2.6)*16 + Math.sin(t*Math.PI*5.2+1)*5;
    pts.push({x,y});
    const b = document.createElement('div');
    b.className = 'bulb' + (lit ? ' on' : '');
    b.style.left = x+'%';
    b.style.top = y+'%';
    b.style.transitionDelay = lit ? '0ms' : (i*65)+'ms';
    els.bulbLayer.appendChild(b);
  }
  els.wirePath.setAttribute('d', 'M ' + pts.map(p=>`${p.x.toFixed(2)},${p.y.toFixed(2)}`).join(' L '));
}

/* ================================================================
   PARTICLES
   ================================================================ */
function addSpark(dim){
  const s = document.createElement('div');
  s.className = 'spark';
  s.dataset.dim = dim ? '1' : '0';
  const size = dim ? (1+Math.random()*1.5) : (1.5+Math.random()*2.5);
  s.style.width = size+'px';
  s.style.height = size+'px';
  s.style.left = Math.random()*100+'%';
  s.style.top = Math.random()*100+'%';
  s.style.setProperty('--dur', (3+Math.random()*4).toFixed(2)+'s');
  s.style.setProperty('--del', (Math.random()*4).toFixed(2)+'s');
  s.style.setProperty('--minop', dim ? '0.03' : '0.15');
  s.style.setProperty('--maxop', dim ? '0.15' : (0.55+Math.random()*0.35).toFixed(2));
  if(!dim && Math.random() < 0.4) s.style.background = 'var(--c-gold-bright)';
  els.particles.appendChild(s);
}

function buildAmbientParticles(){
  const count = window.innerWidth < 640 ? 8 : 14;
  for(let i=0;i<count;i++) addSpark(true);
}

function boostParticles(){
  const count = window.innerWidth < 640 ? 16 : 28;
  for(let i=0;i<count;i++) addSpark(false);
  els.particles.querySelectorAll('.spark[data-dim="1"]').forEach(s=>{
    s.style.setProperty('--minop','0.15');
    s.style.setProperty('--maxop','0.75');
  });
}

function resetParticlesToAmbient(){
  els.particles.innerHTML = '';
  buildAmbientParticles();
}

function sparkleBurstAt(xPct,yPct){
  for(let i=0;i<14;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    const x = xPct + (Math.random()*30-15);
    const y = yPct + (Math.random()*24-12);
    s.style.left = x+'%';
    s.style.top = y+'%';
    const size = 2+Math.random()*2.5;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.background = 'var(--c-gold-bright)';
    s.style.setProperty('--dur','1.2s');
    s.style.setProperty('--del','0s');
    s.style.setProperty('--minop','0');
    s.style.setProperty('--maxop','1');
    els.particles.appendChild(s);
    setTimeout(()=> s.remove(), 1400);
  }
}

/* ================================================================
   CONFETTI + HEARTS
   ================================================================ */
function burstConfetti(count){
  const colors = ['var(--c-gold)','var(--c-gold-bright)','var(--c-rose)','var(--c-lilac)','var(--c-cream)'];
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.setProperty('--rot', (Math.random()*720-360)+'deg');
    const dur = 3+Math.random()*2.4;
    p.style.animationDuration = dur+'s';
    p.style.animationDelay = (Math.random()*0.4)+'s';
    const w = 6+Math.random()*6;
    p.style.width = w+'px';
    p.style.height = (w*1.7)+'px';
    els.confettiLayer.appendChild(p);
    setTimeout(()=> p.remove(), (dur+0.6)*1000);
  }
}

function spawnHeart(){
  const h = document.createElement('div');
  h.className = 'heart-piece';
  const colors = ['var(--c-rose)','var(--c-lilac)','var(--c-gold-bright)'];
  h.style.background = colors[Math.floor(Math.random()*colors.length)];
  h.style.left = (5+Math.random()*90)+'%';
  const dur = 6+Math.random()*3;
  h.style.animationDuration = dur+'s';
  els.heartsLayer.appendChild(h);
  setTimeout(()=> h.remove(), dur*1000+200);
}

/* ================================================================
   RESET / CELEBRATE AGAIN
   ================================================================ */
function resetExperience(){
  clearInterval(state.heartTimer);
  clearInterval(state.fadeTimer);

  const audio = els.bgMusic;
  audio.pause();
  audio.currentTime = 0;
  audio.volume = 0;
  els.musicControl.classList.remove('show');
  els.musicControl.hidden = true;

  els.confettiLayer.innerHTML = '';
  els.heartsLayer.innerHTML = '';

  els.cakeWrap.classList.remove('state-center','state-final');
  els.cakeWrap.classList.add('state-hidden');

  els.finalScene.classList.remove('active');
  els.headline.innerHTML = '';
  els.letterLines.querySelectorAll('.letter-line').forEach(el=> el.classList.remove('show'));
  els.signature.classList.remove('show');
  els.celebrateBtn.classList.remove('show');

  document.body.classList.remove('lit');
  document.querySelectorAll('.bulb').forEach(b=> b.classList.remove('on'));
  resetParticlesToAmbient();

  [els.dialog1, els.dialog2, els.dialog3].forEach(d=> d.classList.remove('show'));
  setTimeout(()=> els.dialog1.classList.add('show'), 800);
}

/* ================================================================
   UTIL
   ================================================================ */
function debounce(fn, wait){
  let t;
  return (...a)=>{ clearTimeout(t); t = setTimeout(()=> fn(...a), wait); };
}
</script>
</body>
</html>
